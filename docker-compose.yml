# Docker Compose configuration for CarBrain AI Assistant
# Defines all containers needed for local development environment

services:  # Define all containers for this project
  api:  # Node.js API container
    image: node:18-alpine
    container_name: carbrain_api
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carbrain_ai
      DB_USER: carbrain_user
      DB_PASSWORD: carbrain_pass
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - carbrain_network
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev"

  postgres:  # PostgreSQL database container
    image: postgres:15
    container_name: carbrain_postgres  # Fixed container name for easy reference
    environment:  # Set PostgreSQL environment variables
      POSTGRES_DB: carbrain_ai      # Create database named carbrain_ai
      POSTGRES_USER: carbrain_user  # Create user carbrain_user
      POSTGRES_PASSWORD: carbrain_pass  # Set password
    ports:
      - "5432:5432"  # Map container port 5432 to host port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist database data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql  # Run init script on startup
    networks:
      - carbrain_network  # Connect to custom network
    healthcheck:  # Check if database is ready
      test: ["CMD-SHELL", "pg_isready -U carbrain_user -d carbrain_ai"]
      interval: 10s  # Check every 10 seconds
      timeout: 5s    # Wait 5 seconds for response
      retries: 5     # Try 5 times before marking unhealthy

  redis:  # Redis cache container for future session/cache management
    image: redis:7-alpine  # Use Redis 7 Alpine image (lightweight)
    container_name: carbrain_redis
    ports:
      - "6379:6379"  # Standard Redis port
    volumes:
      - redis_data:/data  # Persist Redis data
    networks:
      - carbrain_network
    command: redis-server --appendonly yes  # Enable persistence with AOF
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]  # Check Redis responds to ping
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:  # Ollama LLM inference engine for local AI processing
    image: ollama/ollama:latest
    container_name: carbrain_ollama
    ports:
      - "11434:11434"  # Ollama API port
    volumes:
      - ollama_models:/root/.ollama  # Persist downloaded models
    networks:
      - carbrain_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:  # Named volumes for data persistence
  postgres_data:
    driver: local  # Store locally on host machine
  redis_data:
    driver: local
  ollama_models:
    driver: local  # Persist Ollama models locally

networks:  # Custom network for container communication
  carbrain_network:
    driver: bridge  # Standard Docker bridge network